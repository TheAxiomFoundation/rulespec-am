name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@ac3fe2105d17168e3df7f0a29f2623c65cbd5a4f
    secrets: inherit
    with:
      # axiom-encode ffa8f3f1 (encoder 0.2.2277) with the shared workflow at
      # ac3fe210, the pair rulespec-il pins. Both postdate axiom-encode#1853
      # (fa0da5e8). At this encoder the generated guard also checks a pull
      # request that changes only files under .axiom/encoding-manifests/.
      axiom-encode-ref: ffa8f3f1d7fef9e26a3d4d2ab0ebe78a40b546cb
      # Engine main at engine#270 (lifetime commencement, engine#260). It
      # contains the Armenia AMD currency seed (engine#167) and dated
      # single-version rules (engine#130).
      axiom-rules-engine-ref: 363c6a6c56f7ad130996b63f7a09cfd4c3d9b021
      # This commit contains the signed Armenia release selector and registry.
      axiom-corpus-ref: 4f57160eb68c5941789ffab2ec991cd007a8c15b
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      run-generated-guard: true
      guard-programs-root: false
